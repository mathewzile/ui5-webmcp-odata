# Texts shown to the user (dialogs and toasts). Everything addressed to the AI agent (tool descriptions,
# error messages in results) stays English on purpose: it is not UI.

# Dialog title of every confirmation asked on behalf of the agent
confirmTitle=Confirm action requested by AI agent

# {0}: name of the entity (e.g. "Book")
confirmCreate=Create a {0}?
confirmUpdate=Update {0}?
# {0}: entity, {1}: key
confirmDelete=Delete {0} {1}?
# {0}: entity, {1}: number of child entries the update would delete
confirmDeleteChildren=Update of {0} deletes child entries ({1}). Continue?
# {0}: entity, {1}: key of the node, {2}: key of the new parent or the text for the top level
confirmMove=Move {0} {1} to {2}?
moveTopLevel=the top level
# {0}: operation, {1}: entity set
confirmRun=Run {0}?
confirmRunOn=Run {0} on {1}?
confirmDiscard=Discard all unsaved changes?
# {0}: entity, {1}: the planned changes, e.g. "create 2, delete 1"
confirmBatch={0}: {1}. Continue?
batchCreate=create {0}
batchUpdate=change {0}
batchDelete=delete {0}

# Toasts. {0}: entity or operation name
toastCreated={0} created
toastUpdated={0} updated
toastDeleted={0} deleted
toastMoved={0} moved
toastExecuted={0} executed
# {0}: entity, {1}: number of changes
toastBatchSaved={0}: {1} change(s) saved
