specVersion: "4.0"
type: library
metadata:
  name: ui5.webmcp.odata
framework:
  name: SAPUI5
  version: "1.153.0"
  libraries:
    - name: sap.ui.core
    - name: sap.m
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        # The published package has no tsconfig.json, so TypeScript is not auto-detected
        transformTypeScript: true
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        transformTypeScript: true
